{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Vyapar Pulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Vyapar Pulse — Business Health Dashboard</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Total Transactions</h5>
                    <p class="fs-3">{{ total_transactions }}</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Anomalies Detected</h5>
                    <p class="fs-3 text-danger">{{ anomaly_count }}</p>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <h4>Business Advisory</h4>
            <p class="border p-3 bg-white">{{ advisory_text }}</p>
        </div>
    </div>
</body>
</html>
